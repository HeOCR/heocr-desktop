# Draft F-Droid build recipe for fdroiddata (metadata/io.github.heocr.heocr_mobile.yml).
# Not submitted: submission is a merge request to https://gitlab.com/fdroid/fdroiddata from a GitLab
# account, on the maintainer's go. Checked in CI with `fdroid readmeta` and `fdroid lint`.
# The descriptions, icon and screenshots come from fastlane/metadata/android/ in the source repo.
Categories:
  - OCR
License: Apache-2.0
AuthorName: HeOCR
WebSite: https://heocr.github.io
SourceCode: https://github.com/HeOCR/heocr-desktop
IssueTracker: https://github.com/HeOCR/heocr-desktop/issues
Changelog: https://github.com/HeOCR/heocr-desktop/releases

AutoName: HeOCR

RepoType: git
Repo: https://github.com/HeOCR/heocr-desktop.git

Builds:
  - versionName: 0.1.0
    disable: Placeholder release; version, tag, versionCode and build recipe require verification.
    versionCode: 10000
    # The tag of the first Android release (to be created with it).
    commit: android-v0.1.0
    output: build/heocr_mobile/android/gradle/app/build/outputs/apk/release/app-release-unsigned.apk
    sudo:
      - apt-get -o quiet=0 update
      - apt-get -o quiet=0 install -y python3 python3-venv python3-pip openjdk-21-jdk-headless build-essential cmake ninja-build git curl zip unzip pkg-config
    ndk: r27c
    build:
      # Tested in the official CI container with the SDK setup documented in the audit.
      # Downloads and binary provenance still require production review.
      - python3 -m venv /tmp/venv
      - . /tmp/venv/bin/activate
      - export PIP_CONFIG_FILE=/dev/null PIP_INDEX_URL=https://pypi.org/simple PIP_EXTRA_INDEX_URL= PIP_VERBOSE=1
      - pip install briefcase==0.4.7
      - export ANDROID_NDK_HOME=$$NDK$$
      - python scripts/build_tesseract.py --target android-arm64 --out build/tess/android-arm64
      - python scripts/build_pillow_android.py --deps build/tess/android-arm64/deps --out build/android-wheels
      # Stage the six exact PyPI release wheels beside the locally built Pillow wheel.
      - >-
        python -m pip download --no-index --no-cache-dir --no-deps --require-hashes
        --platform android_23_arm64_v8a --python-version 3.13
        --dest build/android-wheels -r docs/stores/fdroid/android-pypi-wheels.txt
      - cat docs/stores/fdroid/android-pypi-wheels.txt build/android-wheels/BUILD_INFO-pillow.json
      - sha256sum build/android-wheels/*.whl
      # Chaquopy 17.2.0 suppresses its extra index only with an explicit --index-url token.
      # --no-index then disables all indexes. Briefcase resolves the ./ wheelhouse path.
      - >-
        python -c 'from pathlib import Path; p = Path("pyproject.toml"); s = p.read_text();
        old = "requirement_installer_args = [\"--find-links\", \"./build/android-wheels\"]";
        assert s.count(old) == 1, "Review the Android pip configuration";
        new = old.replace("[", "[\"--index-url\", \"https://pypi.org/simple\", \"--no-index\", \"--verbose\", ", 1);
        p.write_text(s.replace(old, new))'
      - python scripts/assemble_resources.py --android build/tess/android-arm64
      - briefcase create android -a heocr_mobile --no-input -v
      - python scripts/android_patch_activity.py
      - python scripts/android_design_res.py
      - cd build/heocr_mobile/android/gradle
      # Briefcase 0.4.7 writes these two template inputs before assembling a debug APK.
      # Write the release equivalents directly so this recipe produces only an unsigned APK.
      - touch app/extract-packages.txt
      - >-
        printf '%s\n' '<resources><string name="main_module">heocr_mobile</string></resources>'
        > app/src/main/res/values/briefcase.xml
      - cat app/pip-options.txt
      - ./gradlew assembleRelease --no-daemon --info --console plain | tee fdroid-gradle.log
      - >-
        if grep -E 'Looking in indexes:|https://chaquo\.com/pypi' fdroid-gradle.log; then
          echo "Unexpected index in the Android pip log" >&2; exit 1;
        fi
      - grep -F 'Looking in links:' fdroid-gradle.log | grep -F '/build/android-wheels'

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 0.1.0
CurrentVersionCode: 10000
