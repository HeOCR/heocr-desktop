# Draft F-Droid build recipe for fdroiddata (metadata/io.github.heocr.heocr_mobile.yml).
# Not submitted: submission is a merge request to https://gitlab.com/fdroid/fdroiddata from a GitLab
# account, on the maintainer's go. Checked in CI with `fdroid readmeta` and `fdroid lint`.
# The descriptions, icon and screenshots come from fastlane/metadata/android/ in the source repo.
Categories:
  - OCR
License: Apache-2.0
AuthorName: HeOCR
WebSite: https://heocr.github.io
SourceCode: https://github.com/HeOCR/heocr-desktop
IssueTracker: https://github.com/HeOCR/heocr-desktop/issues
Changelog: https://github.com/HeOCR/heocr-desktop/releases

AutoName: HeOCR

RepoType: git
Repo: https://github.com/HeOCR/heocr-desktop.git

Builds:
  - versionName: 0.1.0
    disable: Placeholder release; version, tag, versionCode and build recipe require verification.
    versionCode: 10000
    # The tag of the first Android release (to be created with it).
    commit: android-v0.1.0
    output: build/heocr_mobile/android/gradle/app/build/outputs/apk/release/app-release-unsigned.apk
    sudo:
      - apt-get update
      - apt-get install -y python3 python3-venv python3-pip cmake ninja-build git curl zip unzip pkg-config
    ndk: r27c
    build:
      # Experimental CI-inspired recipe, not proven on the F-Droid buildserver. See the audit.
      # Downloads and binary provenance require review; this is not an all-source build.
      - python3 -m venv /tmp/venv
      - . /tmp/venv/bin/activate
      - pip install briefcase==0.4.7
      - export ANDROID_NDK_HOME=$$NDK$$
      - python scripts/build_tesseract.py --target android-arm64 --out build/tess/android-arm64
      - python scripts/build_pillow_android.py --deps build/tess/android-arm64/deps --out build/android-wheels
      - python scripts/assemble_resources.py --android build/tess/android-arm64
      - briefcase create android -a heocr_mobile --no-input
      - python scripts/android_patch_activity.py
      - python scripts/android_design_res.py
      - briefcase build android -a heocr_mobile --no-input
      - cd build/heocr_mobile/android/gradle
      - ./gradlew assembleRelease --console plain

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 0.1.0
CurrentVersionCode: 10000
