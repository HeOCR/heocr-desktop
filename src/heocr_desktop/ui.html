<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' 'unsafe-eval'; img-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HeOCR</title>
<style>
:root {
  --bg: #ffffff; --surface: #f6f7f9; --line: #dfe3e8; --text: #1c2430; --muted: #5d6b7c;
  --accent: #2557d6; --accent-soft: #e7eefc; --warn: #8a5a00; --warn-soft: #fff4dc;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15191f; --surface: #1d232b; --line: #2e3742; --text: #e6eaef; --muted: #9aa6b4;
          --accent: #7aa2ff; --accent-soft: #233150; --warn: #f0c46c; --warn-soft: #3a3020; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 15px/1.6 -apple-system, "Segoe UI", system-ui, "Arial Hebrew", Arial, sans-serif; }
body { display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 17px; margin: 0; font-weight: 700; }
header .tag { color: var(--muted); font-size: 13px; flex: 1; }
button { font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); cursor: pointer; }
button:hover { background: var(--accent-soft); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.primary:hover { filter: brightness(1.08); }
main { flex: 1; overflow: auto; padding: 18px; }
.hidden { display: none !important; }
#drop { height: 100%; min-height: 320px; border: 2px dashed var(--line); border-radius: 16px; display: flex;
  flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 24px; }
#drop.over { border-color: var(--accent); background: var(--accent-soft); }
#drop .big { font-size: 22px; font-weight: 600; }
#drop .muted, .muted { color: var(--muted); font-size: 13px; }
.offline { display: inline-flex; gap: 8px; align-items: center; margin-top: 14px; font-size: 13px; color: var(--muted); }
#busy { max-width: 520px; margin: 80px auto; text-align: center; }
progress { width: 100%; height: 10px; accent-color: var(--accent); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.bar .spacer { flex: 1; }
.routes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); }
.notice { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; margin-bottom: 10px; }
#doc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 22px; }
#doc h1, #doc h2, #doc h3, #doc h4 { margin: 0.8em 0 0.3em; line-height: 1.35; }
#doc h1 { font-size: 1.4em; } #doc h2 { font-size: 1.25em; } #doc h3 { font-size: 1.1em; }
#doc p { margin: 0.4em 0 0.8em; unicode-bidi: plaintext; }
#doc table { border-collapse: collapse; margin: 0.6em 0 1em; font-size: 14px; }
#doc th, #doc td { border: 1px solid var(--line); padding: 4px 10px; text-align: start; vertical-align: top; unicode-bidi: plaintext; }
#doc th { background: var(--accent-soft); }
#doc .page-mark { color: var(--muted); font-size: 12px; border-top: 1px dashed var(--line); padding-top: 4px; margin-top: 14px; }
#doc .note { color: var(--muted); font-size: 12.5px; font-style: italic; }
#plain { white-space: pre-wrap; unicode-bidi: plaintext; font: 14px/1.6 ui-monospace, Menlo, Consolas, monospace; margin: 0; }
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--text); max-width: 560px; padding: 20px 24px; }
dialog::backdrop { background: rgba(0,0,0,0.35); }
dialog pre { white-space: pre-wrap; font-size: 12px; max-height: 220px; overflow: auto; background: var(--surface); padding: 8px; border-radius: 8px; }
.toast { position: fixed; bottom: 18px; inset-inline-end: 18px; background: var(--text); color: var(--bg); padding: 6px 14px; border-radius: 8px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1 data-s="title"></h1>
  <span class="tag" data-s="tagline"></span>
  <button id="lang"></button>
  <button id="about-btn" data-s="about"></button>
</header>
<main>
  <section id="drop">
    <div class="big" data-s="drop"></div>
    <div class="muted" data-s="or"></div>
    <button class="primary" id="open" data-s="open"></button>
    <div class="muted" data-s="types"></div>
    <div class="offline">🔒 <span data-s="offline"></span></div>
  </section>
  <section id="busy" class="hidden">
    <div><span data-s="reading"></span> <strong id="busy-name" dir="auto"></strong></div>
    <progress id="prog"></progress>
    <div class="muted" id="busy-detail"></div>
  </section>
  <section id="result" class="hidden">
    <div class="bar">
      <strong id="res-name" dir="auto"></strong>
      <span class="spacer"></span>
      <button id="view" ></button>
      <button id="copy" data-s="copy"></button>
      <button id="save-txt" data-s="save_txt"></button>
      <button id="save-md" data-s="save_md"></button>
      <button id="save-json" data-s="save_json"></button>
      <button class="primary" id="again" data-s="another"></button>
    </div>
    <div class="routes" id="routes"></div>
    <div id="notices"></div>
    <div id="doc"></div>
    <pre id="plain" class="hidden"></pre>
  </section>
</main>
<dialog id="about">
  <h2 data-s="title"></h2>
  <p data-s="about_body"></p>
  <p>🔒 <span data-s="offline"></span></p>
  <h3 data-s="versions"></h3>
  <div id="versions" class="muted"></div>
  <h3 data-s="licences"></h3>
  <pre id="licences"></pre>
  <p><button id="about-close" data-s="close"></button></p>
</dialog>
<script>
"use strict";
const BOOT = /*BOOT*/null;
let S = BOOT.strings[BOOT.lang], lang = BOOT.lang, plain = false, current = null, timer = null;
const $ = (id) => document.getElementById(id);

function api() { return window.pywebview && window.pywebview.api; }

function applyStrings() {
  S = BOOT.strings[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = S.dir;
  document.querySelectorAll("[data-s]").forEach(el => { el.textContent = S[el.dataset.s] || ""; });
  $("lang").textContent = S.lang_toggle;
  $("view").textContent = plain ? S.view_structured : S.view_text;
  if (current) showResult(current);
}

function show(which) {
  for (const id of ["drop", "busy", "result"]) $(id).classList.toggle("hidden", id !== which);
}

function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 1600);
}

function routeLabel(route) { return S["route_" + route] || (S.route_unknown + ": " + route); }

function pagesText(pages) {
  if (!pages || !pages.length) return "";
  const runs = []; let a = pages[0], b = pages[0];
  for (const p of pages.slice(1)) { if (p === b + 1) { b = p; } else { runs.push([a, b]); a = b = p; } }
  runs.push([a, b]);
  return " · " + S.pages + " " + runs.map(([x, y]) => x === y ? x : x + "–" + y).join(", ");
}

function showResult(r) {
  current = r;
  $("res-name").textContent = r.name;
  const routes = $("routes"); routes.innerHTML = "";
  for (const [route, pages] of r.routes) {
    const c = document.createElement("span"); c.className = "chip";
    c.textContent = routeLabel(route) + pagesText(pages); routes.appendChild(c);
  }
  const notes = $("notices"); notes.innerHTML = "";
  const add = (text) => { const d = document.createElement("div"); d.className = "notice"; d.dir = "auto"; d.textContent = text; notes.appendChild(d); };
  if (r.routes.some(([route]) => route === "ocr")) add(S.unverified);
  for (const [reason, detail] of r.unread) add(S.unread_title + ": " + (S["unread_" + reason] || (reason + (detail ? " (" + detail + ")" : ""))));
  $("doc").innerHTML = r.html;           // built and escaped in Python (render.py)
  $("plain").textContent = r.text;
  $("doc").classList.toggle("hidden", plain);
  $("plain").classList.toggle("hidden", !plain);
  show("result");
}

async function poll() {
  const st = await api().status();
  if (st.state === "busy") {
    $("busy-name").textContent = st.name || "";
    if (st.fraction === null || st.fraction === undefined) { $("prog").removeAttribute("value"); $("busy-detail").textContent = ""; }
    else { $("prog").max = 1; $("prog").value = st.fraction;
           $("busy-detail").textContent = st.total ? S.pages_of.replace("{done}", Math.min(st.done, st.total)).replace("{total}", st.total) : ""; }
    show("busy");
    return;
  }
  clearInterval(timer); timer = null;
  if (st.state === "done") showResult(st.result);
  else if (st.state === "error") { show("drop"); alert(S.error + ":\n" + st.error); }
}

function started() { if (!timer) { timer = setInterval(poll, 250); } poll(); }
window.heocrStarted = started;

async function copyText() {
  const text = plain || !current ? (current ? current.text : "") : current.text;
  try { await navigator.clipboard.writeText(text); toast(S.copied); return; } catch (e) {}
  const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
  const ok = document.execCommand("copy"); ta.remove();
  if (ok) toast(S.copied); else if (await api().copy(text)) toast(S.copied);
}

async function save(kind) { if (await api().save(kind)) toast(S.saved); }

async function openFile() { if (await api().open_dialog()) started(); }

document.addEventListener("dragover", e => { e.preventDefault(); $("drop").classList.add("over"); });
document.addEventListener("dragleave", () => $("drop").classList.remove("over"));
document.addEventListener("drop", () => $("drop").classList.remove("over"));

window.addEventListener("pywebviewready", async () => {
  $("open").onclick = openFile;
  $("again").onclick = () => { current = null; show("drop"); };
  $("copy").onclick = copyText;
  $("save-txt").onclick = () => save("txt");
  $("save-md").onclick = () => save("md");
  $("save-json").onclick = () => save("json");
  $("view").onclick = () => { plain = !plain; applyStrings(); };
  $("lang").onclick = async () => { lang = lang === "he" ? "en" : "he"; await api().set_lang(lang); applyStrings(); };
  $("about-btn").onclick = async () => {
    const a = await api().about();
    $("versions").textContent = a.versions; $("licences").textContent = a.licences; $("about").showModal();
  };
  $("about-close").onclick = () => $("about").close();
});
applyStrings();
</script>
</body>
</html>
