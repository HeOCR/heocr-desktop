[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heocr-desktop"
version = "0.1.0"
description = "HeOCR for the desktop: Hebrew text out of PDFs, Word documents and images, offline"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "HeOCR maintainers" }]
dependencies = [
  # heocr 0.1.0rc1, the release candidate in the D-bench gate. Moves to 0.1.0 after the verdict.
  "heocr @ git+https://github.com/HeOCR/heocr@57e58deb3a230a86b07e9fdf110223cac9fbf471",
  "pywebview==6.2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
heocr_desktop = ["ui.html", "THIRD_PARTY_LICENSES.md", "resources/**/*"]

# -- Briefcase: the signed macOS app and DMG, and the Windows MSI ---------------------------------
[tool.briefcase]
project_name = "HeOCR"
bundle = "io.github.heocr"
version = "0.1.0"
url = "https://heocr.github.io"
license.file = "LICENSE"
author = "HeOCR maintainers"
author_email = "heocr@users.noreply.github.com"

[tool.briefcase.app.heocr_desktop]
formal_name = "HeOCR"
description = "Hebrew text out of PDFs, Word documents and images, offline"
long_description = """Drop in a PDF, a Word document or an image and get its Hebrew text, with headings,
paragraphs and tables. Everything runs on this computer: no network, no telemetry."""
icon = "icons/heocr"
sources = ["src/heocr_desktop"]
requires = [
  "heocr @ git+https://github.com/HeOCR/heocr@57e58deb3a230a86b07e9fdf110223cac9fbf471",
  "pywebview==6.2.1",
]

[tool.briefcase.app.heocr_desktop.macOS]
universal_build = false     # arm64 for now; see README "Universal macOS builds"
min_os_version = "11.0"
requires = []

[tool.briefcase.app.heocr_desktop.windows]
requires = []

[tool.briefcase.app.heocr_desktop.linux]
requires = []
