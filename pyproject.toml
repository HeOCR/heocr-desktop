[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heocr-desktop"
version = "0.1.0"
description = "HeOCR desktop app: drop in a PDF, Word file or image and get its Hebrew text out. Fully offline."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
authors = [{ name = "HeOCR maintainers" }]
# Each app pins its own heocr in its Briefcase requires below (desktop: 0.1.2, Android: 0.2.0rc1).
# Nothing here, because Briefcase adds [project].dependencies to every app.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
# The desktop app from a checkout (python -m heocr_desktop) and its unit tests.
# heocr 0.1.2 from PyPI: the gated 0.1.0 plus its fixes (tag v0.1.2, ac1ad20).
desktop = ["heocr==0.1.2", "pywebview==6.2.1"]

[project.urls]
Homepage = "https://heocr.github.io"
Source = "https://github.com/HeOCR/heocr-desktop"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
heocr_desktop = ["ui/*", "resources/**/*"]
heocr_mobile = ["app.css", "ui_strings.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ---------------------------------------------------------------------------------------------
# Briefcase: the macOS .app/.dmg and the Windows .msi.
# ---------------------------------------------------------------------------------------------
[tool.briefcase]
project_name = "HeOCR"
bundle = "io.github.heocr"
version = "0.1.0"
url = "https://heocr.github.io"
license = "Apache-2.0"
author = "HeOCR maintainers"

[tool.briefcase.app.heocr_desktop]
formal_name = "HeOCR"
description = "Hebrew text out of any document, fully offline"
long_description = """HeOCR reads Hebrew text out of PDFs, Word files and images. Drop a file \
into the window and get its text, headings and tables, ready to copy or save as text, \
Markdown or JSON. It runs entirely on your computer: no network, no telemetry."""
sources = ["src/heocr_desktop"]
icon = "icons/heocr"
# Pinned to the versions heocr's release gate ran with, so the app reads PDFs exactly as measured.
requires = [
  "heocr==0.1.2",
  "pypdfium2==5.15.2",
  "Pillow==13.0.0",
  "defusedxml==0.7.1",
  "pywebview==6.2.1",
]
# proxy_tools (a pywebview dependency, MIT) ships no wheel; scripts/prebuild_wheels.py builds it.
requirement_installer_args = ["--find-links", "build/wheels"]
test_sources = ["tests"]
test_requires = ["pytest"]

[tool.briefcase.app.heocr_desktop.macOS]
universal_build = true
# Parts of Python the app never uses: Tk, curses, the test suite and IDLE. Smaller, and fewer
# components to audit.
cleanup_paths = [
  "**/lib/libtcl8*", "**/lib/libtk8*", "**/lib/libtclstub*", "**/lib/libtkstub*",
  "**/lib/tcl8*", "**/lib/tk8*", "**/lib/itcl*", "**/lib/thread2*", "**/lib/tclConfig.sh", "**/lib/tclooConfig.sh", "**/lib/tkConfig.sh",
  "**/lib/libncurses*", "**/lib/libpanel*", "**/lib/libform*", "**/lib/libmenu*", "**/lib/libcurses*",
  "**/lib-dynload/_curses*", "**/lib-dynload/_tkinter*", "**/lib-dynload/_test*", "**/lib-dynload/_ctypes_test*", "**/lib-dynload/xx*",
  "**/lib/python3.12/test", "**/lib/python3.12/idlelib", "**/lib/python3.12/tkinter", "**/lib/python3.12/turtledemo", "**/lib/python3.12/ensurepip", "**/lib/python3.12/lib2to3", "**/lib/python3.12/curses",
]
min_os_version = "13.0"  # pypdfium2 5.15.2 wheels need macOS 13
requires = []
# pywebview's WebKit window. No camera, microphone, location or network entitlement.
info."NSHumanReadableCopyright" = "Apache-2.0. heocr.github.io"
info."LSApplicationCategoryType" = "public.app-category.productivity"

[tool.briefcase.app.heocr_desktop.windows]
requires = []
use_full_install_path = false

[tool.briefcase.app.heocr_desktop.linux]
requires = []

# ---------------------------------------------------------------------------------------------
# Briefcase: the Android app (docs/mobile-design.md). M0: built and tested in CI only.
# Same engine, renderer and strings as the desktop app (src/heocr_desktop), same heocr and pins.
# ---------------------------------------------------------------------------------------------
[tool.briefcase.app.heocr_mobile]
formal_name = "HeOCR"
description = "Hebrew text out of photos and documents, fully offline"
long_description = """HeOCR reads Hebrew text out of photos, PDFs, Word files and images, on the \
phone itself. It has no internet permission: nothing you read ever leaves the phone."""
sources = ["src/heocr_mobile", "src/heocr_desktop"]
icon = "icons/heocr"
requires = [
  # heocr 0.2.0rc1: HeOCR's own models in the package, heocr_modern_v1 by default (D6), as the desktop
  # app will read once 0.2.0 ships.
  "heocr==0.2.0rc1",
  "pypdfium2==5.15.2",
  "Pillow==13.0.0",  # built for Android by scripts/build_pillow_android.py (Pillow has no Android wheels)
  "defusedxml==0.7.1",
]
requirement_installer_args = ["--find-links", "./build/android-wheels"]  # "./": Briefcase makes it absolute
test_sources = ["android/tests"]
test_requires = ["pytest"]
permission.camera = "HeOCR reads the text in photos you take. Photos stay on this phone."

[tool.briefcase.app.heocr_mobile.android]
requires = ["toga-android==0.5.7"]
# The design's launcher (white ground, the owner's choice) and splash, under the names Briefcase reads:
# design/android/launcher/briefcase/ and splash/briefcase/. scripts/android_design_res.py adds the rest.
icon = "icons/android/heocr"
splash_background_color = "#FFFFFF"
android_abis = ["arm64-v8a"]
# What the template already brings (AppCompat), plus androidx.webkit: Toga's WebView needs it for its
# navigation hook (every control in the page is a link) and for pages over 2 MB. Toga needs Material
# only for OptionContainer, which the app does not use; leaving it out takes about 4 MB off the APK.
build_gradle_dependencies = ["androidx.webkit:webkit:1.15.0"]
# DayNight: the WebView reports the phone's dark theme to the page (prefers-color-scheme). The app
# hides the action bar itself and draws the design's own (design/android/SPEC.md, sections 3.6, 6.1).
base_theme = "Theme.AppCompat.DayNight.DarkActionBar"
# One activity: a document shared while the app is open reaches it (scripts/android_patch_activity.py
# hands the new intent to Python).
android_manifest_activity_attrs_extra_content = 'android:launchMode="singleTask"'
# The share sheet ("Share" → HeOCR) and "Open with": PDF, DOCX and images.
android_manifest_activity_extra_content = """
<intent-filter>
    <action android:name="android.intent.action.SEND" />
    <category android:name="android.intent.category.DEFAULT" />
    <data android:mimeType="application/pdf" />
    <data android:mimeType="application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
    <data android:mimeType="image/*" />
</intent-filter>
<intent-filter>
    <action android:name="android.intent.action.VIEW" />
    <category android:name="android.intent.category.DEFAULT" />
    <data android:scheme="content" />
    <data android:mimeType="application/pdf" />
    <data android:mimeType="application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
    <data android:mimeType="image/*" />
</intent-filter>
"""
# No network at all: Briefcase adds these two by default; false leaves them out of the manifest,
# so Android itself refuses every socket the app opens.
permission."android.permission.INTERNET" = false
permission."android.permission.ACCESS_NETWORK_STATE" = false
# - extractPackages: Tesseract needs its models (heocr_mobile/resources) as real files.
# - jniLibs: Tesseract as libtesseract_exec.so (scripts/assemble_resources.py --android), kept
#   extracted at install time, the one place Android lets an app run an executable from.
build_gradle_extra_content = """
android {
    defaultConfig {
        python {
            extractPackages "heocr_mobile", "heocr"
            // Toga's WebViewClient, so the app sees each link the page follows (heocr_mobile.app.navigate).
            staticProxy "toga_android.widgets.internal.webview"
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs += ["../../../../android/jniLibs"]
        }
    }
}
"""
