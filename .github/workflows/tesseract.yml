# Builds the Tesseract the app ships, from pinned sources, for every target, and uploads each as
# an artifact. Used by release.yml and by hand. Per-PR CI (ci.yml) builds or restores the same
# cache entries inside its own jobs instead, so a PR queues only one macOS job.
name: Tesseract

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-15
          - target: macos-x86_64
            os: macos-15
          - target: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/tesseract
        with:
          target: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: tesseract-${{ matrix.target }}
          path: build/tess/${{ matrix.target }}
          retention-days: 30
