# Every PR and every push to main: unit tests, then the real app built and packaged on macOS
# and Windows, then a smoke conversion of one fixture per file type inside the packaged app.
#
# One macOS job per PR. GitHub's hosted macOS runners are often short (a queued job can be dropped
# after 15 minutes, "not acquired by Runner of type hosted"), so everything that needs a Mac runs
# in that one job: both Tesseract slices (cached; x86_64 is built on the arm64 runner), the
# universal2 app, its smoke test under both architectures, and the DMG.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[test,desktop]"
      - run: python -m pytest -q

  macos:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/tesseract
        with:
          target: macos-arm64
      - uses: ./.github/actions/tesseract
        with:
          target: macos-x86_64
      - name: Bundle Tesseract (universal2) and its models
        run: |
          chmod +x build/tess/*/tesseract
          python scripts/assemble_resources.py build/tess/macos-arm64 build/tess/macos-x86_64
      - run: |
          python -m pip install briefcase==0.4.7
          python scripts/prebuild_wheels.py
      - name: Build the app (ad-hoc signed; release builds are signed locally with Developer ID)
        run: |
          briefcase create macOS -a heocr_desktop --no-input
          briefcase build macOS -a heocr_desktop --no-input
      - name: Smoke-test the packaged app (one fixture per type), arm64
        run: python scripts/smoke_app.py macos
      - name: Smoke-test the packaged app, x86_64 under Rosetta (Intel coverage)
        run: |
          softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true
          python scripts/smoke_app.py macos-x86_64
      - name: Package a DMG (ad-hoc)
        run: briefcase package macOS -a heocr_desktop --adhoc-sign --no-input
      - uses: actions/upload-artifact@v4
        with:
          name: heocr-macos-adhoc-dmg
          path: dist/*.dmg
          retention-days: 14
      # The built app with Briefcase's bundle folder, as a tarball (keeps symlinks and modes), for
      # scripts/sign_ci_app.sh: the maintainer's Mac signs and notarizes it without building anything.
      - name: The built app, for signing elsewhere
        run: |
          tar -czf heocr-macos-app.tgz -C build/heocr_desktop/macos app
          shasum -a 256 heocr-macos-app.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: heocr-macos-app-unsigned
          path: |
            heocr-macos-app.tgz
            build/smoke-report-*.json
          retention-days: 14

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/tesseract
        with:
          target: windows-x64
      - name: Bundle Tesseract and its models
        run: python scripts/assemble_resources.py build/tess/windows-x64
      - run: |
          python -m pip install briefcase==0.4.7
          python scripts/prebuild_wheels.py
      - name: Build the app
        run: |
          briefcase create windows -a heocr_desktop --no-input
          briefcase build windows -a heocr_desktop --no-input
      - name: Smoke-test the built app (one fixture per type)
        run: python scripts/smoke_app.py windows
      - name: Package the MSI (unsigned)
        run: briefcase package windows -a heocr_desktop --adhoc-sign --no-input
      # Code signing slot. SignPath Foundation signs release builds only, after a manual approval
      # per release (docs/code-signing-policy.md); PR builds stay unsigned.
      - name: Install the MSI and smoke-test the installed app
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist\*.msi | Select-Object -First 1
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart /l*v msi-install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content msi-install.log -Tail 50; exit $p.ExitCode }
          python scripts/smoke_app.py windows-installed
      - uses: actions/upload-artifact@v4
        with:
          name: heocr-windows-msi-unsigned
          path: dist/*.msi
          retention-days: 14
