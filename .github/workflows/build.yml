name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tesseract:
    name: tesseract (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-15, args: "--arch arm64" }
          - { name: windows-x64, os: windows-latest, args: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        id: cache
        with:
          path: vendor-out
          key: tesseract-${{ matrix.name }}-${{ hashFiles('scripts/build_tesseract.py') }}
      - name: Build Tesseract from pinned sources
        if: steps.cache.outputs.cache-hit != 'true'
        run: python scripts/build_tesseract.py --out vendor-out ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with: { name: "tesseract-${{ matrix.name }}", path: vendor-out }

  app:
    name: app (${{ matrix.name }})
    needs: tesseract
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-15 }
          - { name: windows-x64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    env:
      HEOCR_DESKTOP_REQUIRE_OCR: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: "tesseract-${{ matrix.name }}", path: vendor-out }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . briefcase==0.4.7
          python scripts/wheels.py
      - name: Bundle Tesseract and models
        run: python scripts/vendor.py --tesseract vendor-out
      - name: Unit and smoke tests (bundled Tesseract)
        run: python -m unittest discover -s tests -t . -v
      - name: Fixtures (invented text only)
        run: python scripts/make_fixtures.py fixtures

      # -- macOS: build, ad-hoc sign (no certificates in CI), DMG, smoke test of the built app --------
      - name: Build the macOS app
        if: runner.os == 'macOS'
        run: |
          briefcase create macOS app --no-input
          briefcase build macOS app --no-input
          briefcase package macOS app --adhoc-sign --no-input
      - name: Smoke test the macOS app
        if: runner.os == 'macOS'
        run: |
          APP="build/heocr_desktop/macos/app/HeOCR.app/Contents/MacOS/HeOCR"
          "$APP" --smoke report.json fixtures/text.pdf fixtures/scan.pdf fixtures/doc.docx fixtures/page.png fixtures/page.jpg fixtures/page.tif
          python scripts/check_smoke.py report.json fixtures/expected.json
          codesign --verify --deep --strict --verbose=2 build/heocr_desktop/macos/app/HeOCR.app

      # -- Windows: build, MSI (unsigned for now), install, smoke test of the installed app ----------
      - name: Build the Windows app and MSI
        if: runner.os == 'Windows'
        run: |
          briefcase create windows app --no-input
          briefcase build windows app --no-input
          briefcase package windows app --adhoc-sign --no-input
      # Code signing drops in here once a certificate exists, for example:
      # - name: Sign the MSI
      #   if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX != ''
      #   run: signtool sign /f cert.pfx /p "$env:WINDOWS_CERT_PASSWORD" /tr http://timestamp.digicert.com /td sha256 /fd sha256 dist\*.msi
      - name: Smoke test the built and the installed Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = "fixtures\text.pdf","fixtures\scan.pdf","fixtures\doc.docx","fixtures\page.png","fixtures\page.jpg","fixtures\page.tif"
          $built = "build\heocr_desktop\windows\app\src\HeOCR.exe"
          Start-Process -FilePath $built -ArgumentList (@("--smoke","report.json") + $files) -Wait -NoNewWindow
          python scripts/check_smoke.py report.json fixtures/expected.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $msi = (Get-ChildItem dist\*.msi | Select-Object -First 1).FullName
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait
          $exe = Get-ChildItem -Recurse -Filter HeOCR.exe -Path "$env:LOCALAPPDATA\Programs","$env:ProgramFiles" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Get-Content install.log -Tail 40; exit 1 }
          Write-Host "installed: $($exe.FullName)"
          Start-Process -FilePath $exe.FullName -ArgumentList (@("--smoke","installed.json") + ($files | ForEach-Object { (Resolve-Path $_).Path })) -Wait -NoNewWindow
          python scripts/check_smoke.py installed.json fixtures/expected.json
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: "heocr-desktop-${{ matrix.name }}"
          path: |
            dist/*.dmg
            dist/*.msi
            report.json
          if-no-files-found: warn
