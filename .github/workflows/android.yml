# The Android app (docs/mobile-design.md, M0), on GitHub Actions only: Tesseract and Pillow for
# arm64-v8a, the Briefcase app, its on-device tests in the Android emulator, and a debug-signed
# APK as an artifact for sideloading. Nothing is published or signed for a store here.
name: Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tesseract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: ./.github/actions/tesseract
        with:
          target: android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: tesseract-android-arm64
          path: build/tess/android-arm64

  pillow:
    needs: tesseract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: tesseract-android-arm64
          path: build/tess/android-arm64
      - name: Cache the Pillow wheel
        id: cache
        uses: actions/cache@v4
        with:
          path: build/android-wheels
          key: pillow-android-${{ hashFiles('scripts/build_pillow_android.py', 'tesseract/**', 'scripts/build_tesseract.py') }}
      - name: Build Pillow 13.0.0 for Android
        if: steps.cache.outputs.cache-hit != 'true'
        run: python scripts/build_pillow_android.py --deps build/tess/android-arm64/deps --out build/android-wheels
      - run: cat build/android-wheels/BUILD_INFO-pillow.json
      - uses: actions/upload-artifact@v4
        with:
          name: pillow-android-arm64
          path: build/android-wheels

  fdroid-metadata:
    # The draft F-Droid recipe (docs/stores/fdroid/) and the store texts, as fdroidserver reads them.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install fdroidserver
      - name: fdroid readmeta and lint
        run: |
          # fdroiddata's own config/ (categories and their icons), which lint checks against; the
          # rest of fdroiddata is not needed, so a shallow sparse checkout.
          git clone --depth 1 --filter=blob:none --sparse https://gitlab.com/fdroid/fdroiddata.git "$RUNNER_TEMP/fdroiddata"
          git -C "$RUNNER_TEMP/fdroiddata" sparse-checkout set config
          mkdir -p "$RUNNER_TEMP/fdroiddata/metadata"
          cp docs/stores/fdroid/*.yml "$RUNNER_TEMP/fdroiddata/metadata/"
          cd "$RUNNER_TEMP/fdroiddata"
          fdroid readmeta
          fdroid lint io.github.heocr.heocr_mobile
      - name: Store text lengths (F-Droid and Play limits)
        run: |
          for d in fastlane/metadata/android/*/; do
            t=$(wc -m < "$d/title.txt"); s=$(wc -m < "$d/short_description.txt"); f=$(wc -m < "$d/full_description.txt")
            echo "$d title=$t short=$s full=$f"
            [ "$t" -le 31 ] && [ "$s" -le 81 ] && [ "$f" -le 4001 ] || { echo "too long: $d"; exit 1; }
            for c in "$d"/changelogs/*.txt; do [ "$(wc -m < "$c")" -le 501 ] || { echo "changelog too long: $c"; exit 1; }; done
          done

  app:
    needs: [tesseract, pillow]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Gradle's downloads survive from run to run, and a second copy of Maven Central (Google's
      # mirror) answers when Maven Central itself does not: a run should not depend on one server.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: A second copy of Maven Central for Gradle
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/heocr-mirror.gradle <<'GRADLE'
          def mirror = "https://maven-central.storage-download.googleapis.com/maven2/"
          settingsEvaluated { settings ->
              settings.pluginManagement.repositories { maven { url = mirror } }
          }
          allprojects {
              buildscript { repositories { maven { url = mirror } } }
              repositories { maven { url = mirror } }
          }
          GRADLE
      - uses: actions/download-artifact@v4
        with:
          name: tesseract-android-arm64
          path: build/tess/android-arm64
      - uses: actions/download-artifact@v4
        with:
          name: pillow-android-arm64
          path: build/android-wheels
      - name: Bundle Tesseract, its models and the test fixtures
        run: |
          python scripts/assemble_resources.py --android build/tess/android-arm64
          cp -R tests/fixtures android/tests/fixtures
      - name: An invented iText-style bill, and how heocr reads it on this host (the device must match)
        run: |
          python -m pip install fonttools 'heocr @ git+https://github.com/HeOCR/heocr.git@fd2ef3e405f6042abe7cfc27fc21830e49cf349b' pypdfium2==5.15.2 Pillow==13.0.0 defusedxml==0.7.1
          font=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          [ -f "$font" ] || { sudo apt-get update -q && sudo apt-get install -y -q fonts-dejavu-core; }
          python scripts/make_itext_style_pdf.py --font "$font" android/tests/fixtures/itext-style.pdf
          PYTHONPATH=src python -m heocr_desktop.diagnostics android/tests/fixtures/itext-style.pdf > android/tests/fixtures/itext-style.expected.json
          cat android/tests/fixtures/itext-style.expected.json
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: python -m pip install briefcase==0.4.7
      - name: Create the app
        run: |
          briefcase create android -a heocr_mobile --no-input
          python scripts/android_patch_activity.py
          python scripts/android_design_res.py
      - name: The manifest asks for no network
        run: |
          manifest=build/heocr_mobile/android/gradle/app/src/main/AndroidManifest.xml
          grep -n "uses-permission" "$manifest" || true
          if grep -q "android.permission.INTERNET\|ACCESS_NETWORK_STATE" "$manifest"; then echo "network permission in the manifest"; exit 1; fi
          grep -q 'android:launchMode="singleTask"' "$manifest" || { echo "activity is not singleTask"; exit 1; }
          for action in SEND VIEW; do grep -q "android.intent.action.$action" "$manifest" || { echo "no $action intent filter"; exit 1; }; done
      - name: Maven Central from this runner (diagnostic)
        run: |
          for u in https://repo.maven.apache.org/maven2/com/chaquo/python/gradle/17.2.0/gradle-17.2.0.pom https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/9.3.1/gradle-9.3.1.pom; do
            curl -sS -o /dev/null -w "%{http_code} %{url_effective}\n" -A "Gradle/9.5.0" "$u" || true
          done
          echo "runner: $ImageOS $ImageVersion"; java -version 2>&1 | head -1
          cat ~/.gradle/gradle.properties 2>/dev/null || echo "no ~/.gradle/gradle.properties"
          ls ~/.gradle/init.d 2>/dev/null || echo "no ~/.gradle/init.d"
          g=build/heocr_mobile/android/gradle
          cat $g/gradle.properties 2>/dev/null || true
          grep -n -A6 "repositories\|pluginManagement" $g/build.gradle $g/settings.gradle 2>/dev/null || true
      # Maven Central now and then refuses a download (the Chaquopy Gradle plugin, twice in a day), which
      # fails the build before anything runs. Resolve Gradle's plugins and dependencies first, with retries;
      # the builds below then find them in the cache.
      # `help` resolves the plugins first; evaluating the app project then fails until Briefcase's own
      # build writes extract-packages.txt, which is expected here. Only a failed download is retried.
      - name: Gradle's plugins and dependencies, with retries
        run: |
          cd build/heocr_mobile/android/gradle
          for i in 1 2 3; do
            ./gradlew --no-daemon help > gradle-warm.log 2>&1 || true
            if ! grep -qiE "could not (get|head|resolve|download)|received status code|connect timed out|connection reset" gradle-warm.log; then
              echo "Gradle's plugins resolved (try $i)"; exit 0
            fi
            grep -iE "could not (get|head|resolve|download)|status code" gradle-warm.log | head -3
            echo "a download failed (try $i); retrying"; sleep $((20 * i))
          done
          exit 1
      - name: On-device tests in the emulator (x86_64 image, arm64 app through Android's ARM translation)
        run: >
          briefcase run android -a heocr_mobile --test -r --no-input -v
          -d '{"avd":"heocrPhone","system_image":"system-images;android-34;google_apis;x86_64"}'
          --Xemulator=-no-window --Xemulator=-no-snapshot --Xemulator=-no-audio --Xemulator=-no-boot-anim
      - name: Gradle's own account of the dependency failure (on failure)
        if: failure()
        run: |
          cd build/heocr_mobile/android/gradle
          ./gradlew assembleDebug --refresh-dependencies --info --stacktrace > gradle-info.log 2>&1 || true
          grep -n -iE "resource missing|status code|could not (get|head|resolve|find)|offline|received|proxy|cached|response|java.home|JVM" gradle-info.log | head -80
          tail -40 gradle-info.log
      - name: Emulator facts (on failure)
        if: failure()
        # adb waits for a device forever when none started (a broken system image download).
        timeout-minutes: 3
        run: |
          adb="${ANDROID_HOME:-$HOME/.cache/briefcase/tools/android_sdk}/platform-tools/adb"
          $adb devices || true
          $adb shell getprop ro.product.cpu.abilist || true
          $adb shell getprop ro.dalvik.vm.native.bridge || true
          $adb logcat -d -t 400 || true
      - name: Build the sideloadable APK (debug-signed, not for a store)
        run: |
          briefcase build android -a heocr_mobile -u -r --no-input
          apk=$(ls build/heocr_mobile/android/gradle/app/build/outputs/apk/debug/*.apk | head -1)
          mkdir -p dist && cp "$apk" dist/HeOCR-android-arm64-debug.apk
          ls -l dist/HeOCR-android-arm64-debug.apk
          sha256sum dist/HeOCR-android-arm64-debug.apk
          unzip -l dist/HeOCR-android-arm64-debug.apk | tail -1
      - name: The APK's own screen in the emulator (start, sample, shares, the picker; API 34)
        env:
          FIXTURES: android/tests/fixtures
        run: scripts/android_ui_smoke.sh dist/HeOCR-android-arm64-debug.apk
      - name: The same on Android 15 (API 35, as on recent Pixels)
        env:
          FIXTURES: android/tests/fixtures
          AVD: heocrPhone35
          AVD_SUFFIX: "-api35"
          # One place for avdmanager and the emulator: newer avdmanager writes under ~/.config otherwise.
          ANDROID_AVD_HOME: ${{ github.workspace }}/.avd
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          image="system-images;android-35;google_apis;x86_64"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$image" > /dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n heocrPhone35 -k "$image" -d pixel --force
          "$ANDROID_HOME/emulator/emulator" -list-avds
          scripts/android_ui_smoke.sh dist/HeOCR-android-arm64-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heocr-android-ui-smoke
          path: |
            dist/ui-smoke
            dist/ui-smoke-api35
            dist/ui-smoke-emulator-*.log
          retention-days: 14
      - name: Release builds (unsigned APK for F-Droid, AAB for Google Play)
        run: |
          cd build/heocr_mobile/android/gradle
          ./gradlew assembleRelease bundleRelease --console plain
          mkdir -p ../../../../dist/release
          cp app/build/outputs/apk/release/*.apk ../../../../dist/release/HeOCR-android-arm64-release-unsigned.apk
          cp app/build/outputs/bundle/release/*.aab ../../../../dist/release/HeOCR-android-release.aab
          cd ../../../../dist/release && ls -l && sha256sum *
      # Play's upload key. Only on main, tags or by hand (never in a PR), and only once the maintainer has
      # set the four repository secrets; until then the AAB stays unsigned. Google re-signs with the app
      # signing key it keeps (Play App Signing).
      - name: Sign the AAB with the Play upload key (when its secrets exist)
        if: github.event_name != 'pull_request' && env.HAS_UPLOAD_KEY == 'true'
        env:
          HAS_UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 dist/release/HeOCR-android-release.aab "$KEY_ALIAS"
          jarsigner -verify dist/release/HeOCR-android-release.aab
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: heocr-android-release
          path: dist/release
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: heocr-android-arm64-debug-apk
          path: dist/HeOCR-android-arm64-debug.apk
          retention-days: 14
